<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Cosmic Planetarium</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0C4A6E',
                        secondary: '#7C3AED',
                        accent: '#14B8A6',
                        dark: '#0A1929',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body
    class="bg-slate-50 dark:bg-dark text-slate-900 dark:text-white min-h-screen flex items-center justify-center relative transition-colors duration-300 py-12">

    <!-- Background Animation -->
    <div class="absolute inset-0 z-0">
        <div
            class="absolute top-0 left-0 w-full h-full bg-[url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2034&auto=format&fit=crop')] bg-cover bg-center opacity-40">
        </div>
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-t from-dark/90 to-dark/40"></div>
    </div>

    <!-- Theme Toggle (Absolute Top Right) -->


    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-lg px-6 py-12">
        <div
            class="glass p-8 md:p-10 rounded-3xl shadow-2xl border border-white/10 backdrop-blur-xl animate-fade-in-up">

            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center space-x-2 group mb-6">
                    <div
                        class="w-10 h-10 rounded-full bg-gradient-to-br from-secondary to-accent flex items-center justify-center text-white shadow-lg group-hover:animate-pulse-glow">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <span class="font-brand font-bold text-2xl text-white uppercase tracking-wider">
                        Cosmic<span class="text-accent">Dome</span>
                    </span>
                </a>
                <h1 class="text-3xl font-heading font-bold mb-2">Join the Cosmos</h1>
                <p class="text-slate-300 text-sm">Create an account to start your journey.</p>
            </div>

            <form action="dashboard-visitor.html" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2 text-slate-300">First Name</label>
                        <input type="text" placeholder="John"
                            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 px-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2 text-slate-300">Last Name</label>
                        <input type="text" placeholder="Doe"
                            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 px-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-3 w-5 h-5 text-slate-500"></i>
                        <input type="email" placeholder="you@example.com"
                            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-slate-500"></i>
                        <input type="password" placeholder="Create a password"
                            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all">
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-secondary to-accent text-white font-bold shadow-lg shadow-secondary/30 hover:shadow-secondary/50 transform hover:-translate-y-1 transition-all mt-4">
                    Create Account
                </button>

                <!-- Social Signup -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-xs uppercase">
                        <span class="bg-slate-900/50 px-2 text-slate-400 backdrop-blur-sm">Or signup with</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button type="button"
                        class="flex items-center justify-center gap-2 py-2.5 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 transition-all text-sm font-medium">
                        <i class="fa-brands fa-google text-red-500"></i> Google
                    </button>
                    <button type="button"
                        class="flex items-center justify-center gap-2 py-2.5 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 transition-all text-sm font-medium">
                        <i class="fa-brands fa-facebook text-blue-500"></i> Facebook
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center text-sm text-slate-400">
                Already have an account? <a href="login.html" class="text-white font-bold hover:underline">Log in</a>
            </div>

        </div>
        <p class="text-center mt-8 text-slate-500 text-xs">
            &copy; 2026 CosmicDome Planetarium. <a href="index.html" class="hover:text-white">Back to Home</a>
        </p>
    </div>

    <script src="assets/js/main.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
