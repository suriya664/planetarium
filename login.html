<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cosmic Planetarium</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0C4A6E',
                        secondary: '#7C3AED',
                        accent: '#14B8A6',
                        dark: '#0A1929',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body
    class="bg-slate-50 dark:bg-dark text-slate-900 dark:text-white min-h-screen flex items-center justify-center relative transition-colors duration-300 py-12">

    <!-- Background Animation -->
    <div class="absolute inset-0 z-0">
        <div
            class="absolute top-0 left-0 w-full h-full bg-[url('https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?q=80&w=2013&auto=format&fit=crop')] bg-cover bg-center opacity-40">
        </div>
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-dark/50 to-dark"></div>
    </div>

    <!-- Theme Toggle (Absolute Top Right) -->
    <button id="theme-toggle"
        class="absolute top-6 right-6 z-20 p-2 bg-white/10 backdrop-blur rounded-full text-white hover:bg-white/20 transition-all">
        <i data-lucide="moon" class="w-6 h-6 dark:hidden"></i>
        <i data-lucide="sun" class="w-6 h-6 hidden dark:block"></i>
    </button>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md px-6">
        <div class="glass p-8 rounded-3xl shadow-2xl border border-white/10 backdrop-blur-xl animate-fade-in-up">

            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center space-x-2 group mb-6">
                    <div
                        class="w-10 h-10 rounded-full bg-gradient-to-br from-secondary to-accent flex items-center justify-center text-white shadow-lg group-hover:animate-pulse-glow">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <span class="font-brand font-bold text-2xl text-white uppercase tracking-wider">
                        Cosmic<span class="text-accent">Dome</span>
                    </span>
                </a>
                <h1 class="text-3xl font-heading font-bold mb-2">Welcome Back</h1>
                <p class="text-slate-300 text-sm">Sign in to manage your tickets and membership.</p>
            </div>

            <form action="dashboard-visitor.html" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-3 w-5 h-5 text-slate-500"></i>
                        <input type="email" placeholder="you@example.com"
                            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-slate-500"></i>
                        <input type="password" placeholder="••••••••"
                            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all">
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-slate-400 cursor-pointer hover:text-white transition-colors">
                        <input type="checkbox"
                            class="mr-2 rounded bg-slate-800 border-slate-700 text-accent focus:ring-accent">
                        Remember me
                    </label>
                    <a href="#" class="text-accent hover:text-white transition-colors">Forgot password?</a>
                </div>

                <button type="submit"
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-secondary to-accent text-white font-bold shadow-lg shadow-secondary/30 hover:shadow-secondary/50 transform hover:-translate-y-1 transition-all">
                    Sign In
                </button>

                <!-- Social Login -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-xs uppercase">
                        <span class="bg-slate-900/50 px-2 text-slate-400 backdrop-blur-sm">Or continue with</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button type="button"
                        class="flex items-center justify-center gap-2 py-2.5 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 transition-all text-sm font-medium">
                        <i class="fa-brands fa-google text-red-500"></i> Google
                    </button>
                    <button type="button"
                        class="flex items-center justify-center gap-2 py-2.5 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 transition-all text-sm font-medium">
                        <i class="fa-brands fa-facebook text-blue-500"></i> Facebook
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center text-sm text-slate-400">
                Don't have an account? <a href="register.html" class="text-white font-bold hover:underline">Sign up</a>
            </div>

        </div>

        <p class="text-center mt-8 text-slate-500 text-xs">
            &copy; 2026 CosmicDome Planetarium. <a href="index.html" class="hover:text-white">Back to Home</a>
        </p>
    </div>

    <script src="assets/js/main.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
