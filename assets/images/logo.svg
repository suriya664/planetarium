<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#logo-grad)" opacity="0.15" />
  <!-- Main Circle -->
  <circle cx="50" cy="50" r="40" fill="url(#logo-grad)" shadow="0 10px 15px rgba(0,0,0,0.3)" />
  <!-- Star Symbol -->
  <path d="M50 22 L56 40 L75 40 L60 52 L66 70 L50 58 L34 70 L40 52 L25 40 L44 40 Z" fill="white" filter="url(#glow)" />
  <!-- Inner Detail -->
  <circle cx="50" cy="50" r="6" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
